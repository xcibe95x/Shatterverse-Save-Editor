[package]
name = "shatterverse-save-editor"
version = "0.4.11"
description = "Desktop save editor for Serious Sam: Shatterverse"
authors = ["Shatterverse Save Editor contributors"]
edition = "2021"

[lib]
name = "shatterverse_save_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["clock"] }
